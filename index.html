<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">   <!-- testfase: niet in Google. Weghalen als de site officieel live gaat. -->
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Soepdetective: interactieve lessen bij de soepen van Good Soup, voor groep 5 tot en met 8.">
<link rel="icon" href="img/ingredienten/wortel.webp">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
<title>Soepdetective</title>
<link rel="preload" href="fonts/baloo2.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/nunito.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* Lettertypes staan in de site zelf (geen Google Fonts): geen gegevens van leerlingen naar derden. Licentie: SIL Open Font License. */
@font-face{font-family:"Baloo 2";font-style:normal;font-weight:600 800;font-display:swap;src:url(fonts/baloo2.woff2) format("woff2")}
@font-face{font-family:"Nunito";font-style:normal;font-weight:600 800;font-display:swap;src:url(fonts/nunito.woff2) format("woff2")}
/* Layout: één podium (zoals een Canva-dia) met verloopbalk als kop; boven niveau + stappen, onder vorige/volgende. Bewust één lichte, crèmekleurige wereld, net als de les. */
:root{
  color-scheme: light;
  --vw:1vw;            /* in dia-modus vast (zie script): alles schaalt dan als één dia */
  --cream:#FFF4D6;      /* achtergrond dia */
  --card:#FDF4E3;       /* kaartjes, gelijk aan achtergrond illustraties */
  --paper:#FFFFFF;
  --ink:#3B2B22;        /* bruine tekst uit de les */
  --muted:#7A6555;
  --orange:#F47B20;
  --orange-dark:#B9520F;
  --green:#4F8F3A;
  --green-soft:#E6F2DD;
  --purple:#7650A6;
  --red:#D1352B;
  --red-soft:#FCE7E1;
  --sun:#F9C406;
  --magenta:#E41D9A;
  --line:#EBD9B8;
  --band:#F47B20;       /* effen oranje: banner, actieve stap, startknop, stemmenbalkjes */
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--cream);color:var(--ink);font-family:var(--body);font-weight:700;font-size:clamp(16px,calc(var(--vw)*1.45),21px);line-height:1.4;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:4px solid var(--purple);outline-offset:3px}
h1,h2,h3{font-family:var(--display);font-weight:800;line-height:1.05;margin:0;text-wrap:balance}
p{margin:0;max-width:62ch}
img{max-width:100%}

.app{max-width:1360px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 20px;min-height:100%;display:flex;flex-direction:column;gap:12px}

/* ---- top ---- */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;border:0;background:none;padding:0;text-align:left}
.brand img{width:52px;height:52px;border-radius:50%;background:var(--card);border:3px solid var(--orange);object-fit:contain;padding:5px}
.brand b{display:block;font-family:var(--display);font-weight:800;font-size:clamp(24px,calc(var(--vw)*2.4),34px);line-height:1}
.brand small{display:block;color:var(--muted);font-size:.75em}
.level{display:flex;background:var(--paper);border:3px solid var(--orange);border-radius:999px;overflow:hidden}
.level button{border:0;background:none;padding:7px 18px;font-weight:800;font-size:16px;color:var(--orange-dark)}
.level button[aria-pressed="true"]{background:var(--orange);color:#fff}

.stepsWrap{overflow-x:auto;padding-bottom:4px}
.steps{display:flex;gap:6px;min-width:max-content}
.step{border:2px solid var(--line);background:var(--paper);border-radius:999px;padding:3px 12px 3px 3px;display:flex;align-items:center;gap:7px;font-size:14px;white-space:nowrap;color:var(--muted)}
.step i{font-style:normal;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--card);font-family:var(--display);font-weight:800}
.step.done i{background:var(--green);color:#fff}
.step.on{background:var(--band);border-color:transparent;color:#fff}
.step.on i{background:#fff;color:var(--ink)}

/* ---- podium ---- */
.stage{flex:1;background:var(--cream);border-radius:22px;box-shadow:0 2px 0 var(--line),0 18px 40px -24px rgba(59,43,34,.45);overflow:hidden;display:flex;flex-direction:column;border:1px solid var(--line)}
.band{background:var(--band);color:#fff;padding:clamp(14px,calc(var(--vw)*2),26px) clamp(18px,calc(var(--vw)*3),44px)}
.band h2{font-size:clamp(28px,calc(var(--vw)*3.4),52px);text-shadow:0 2px 0 rgba(0,0,0,.08)}
.inner{padding:clamp(18px,calc(var(--vw)*2.8),40px) clamp(18px,calc(var(--vw)*3),44px);display:flex;flex-direction:column;gap:clamp(14px,calc(var(--vw)*1.8),24px)}
.label{font-size:.78em;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.btn,.ghost{border-radius:999px;padding:9px 24px;font-weight:800;border:3px solid var(--orange)}
.btn{background:var(--orange);color:#fff}
.ghost{background:var(--paper);color:var(--orange-dark)}
.btn:active,.ghost:active{transform:translateY(2px)}
.btn:disabled,.ghost:disabled{opacity:.4;cursor:default}

/* tekstballon met mascotte */
.say{display:flex;align-items:center;gap:10px}
.say img{width:clamp(52px,calc(var(--vw)*5),72px);height:clamp(52px,calc(var(--vw)*5),72px);border-radius:50%;object-fit:contain;padding:5px;background:var(--card);border:3px solid var(--orange);flex:none}
.bubble{position:relative;background:var(--paper);border:3px solid var(--line);border-radius:18px;padding:10px 16px}
.say.ok .bubble{background:var(--green-soft);border-color:var(--green)}
.say.no .bubble{background:var(--red-soft);border-color:var(--red);color:var(--red)}
.say.win .bubble{background:var(--sun);border-color:var(--sun);font-size:1.1em}
.say.win img{animation:hop .5s ease-in-out 3}
@keyframes hop{50%{transform:translateY(-10px) rotate(6deg)}}

.count{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.slots{display:flex;gap:6px}
.slot{width:22px;height:22px;border-radius:50%;border:3px solid var(--green);background:var(--paper)}
.slot.full{background:var(--green)}
.onthoud{background:var(--ink);color:#fff;border-radius:18px;padding:16px 20px;display:flex;gap:16px;align-items:center}
.onthoud b{font-family:var(--display);font-size:1.3em;color:var(--sun);flex:none}

/* ---- start ---- */
.cover{flex:1;position:relative;min-height:clamp(380px,calc(var(--vw)*48),620px);display:flex;align-items:center;background:var(--cover) right center/cover no-repeat}
.cover::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--cream) 0%,var(--cream) 42%,rgba(255,244,214,.75) 55%,rgba(255,244,214,0) 70%)}
.coverText{position:relative;padding:clamp(20px,calc(var(--vw)*4),64px);display:flex;flex-direction:column;gap:18px;max-width:640px}
.coverText h1{font-size:clamp(46px,calc(var(--vw)*6.4),104px);line-height:.95}
.coverText .kv{color:var(--orange-dark);font-size:1.15em}
.coverText .kv span{display:block;font-size:.7em;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.big{background:var(--band);color:#fff;border:0;border-radius:999px;font-family:var(--display);font-weight:800;font-size:clamp(26px,calc(var(--vw)*2.6),36px);padding:8px 44px;align-self:flex-start;box-shadow:0 6px 0 var(--orange-dark)}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 var(--orange-dark)}
.coverText .ghost.small{align-self:flex-start}
.kiezer{display:flex;flex-direction:column;gap:clamp(12px,calc(var(--vw)*1.6),20px)}
.klaarrij{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:inherit}
.laterrij{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.soepkaart{container-type:inline-size;border:3px solid var(--orange);border-radius:20px;background:var(--kleur,var(--card));padding:10px 10px 14px;display:flex;flex-direction:column;align-items:center;gap:6px;font-family:var(--display);font-weight:800;font-size:clamp(18px,calc(var(--vw)*1.6),24px);color:var(--ink);text-align:center}
.soepkaart img{width:100%;aspect-ratio:1;object-fit:contain;filter:drop-shadow(0 8px 10px rgba(59,43,34,.18))}
.soepkaart b{font-size:min(30px,12.5cqi);white-space:nowrap;line-height:1.1}   /* naam past altijd op één regel */
button.soepkaart{cursor:pointer;transition:transform .15s}
button.soepkaart:hover{transform:translateY(-3px)}
.soepkaart.later{border:3px dashed rgba(59,43,34,.18);color:var(--muted)}
.soepkaart.later{padding:10px 8px;justify-content:center}
.soepkaart.later>*{opacity:.75}
.soepkaart.later b{font-size:min(22px,12cqi)}
.soepkaart .leeg{width:100%;aspect-ratio:1;border-radius:14px;background:repeating-linear-gradient(45deg,rgba(255,255,255,.35) 0 12px,transparent 12px 24px)}
.soepkaart small{font-family:var(--body,inherit);font-size:min(18px,8cqi);font-weight:700;margin-top:-4px}

/* ---- proeven ---- */
.taste{display:grid;grid-template-columns:1.2fr 1fr;gap:clamp(16px,calc(var(--vw)*3),40px);align-items:center}
.cloud{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center}
.word{border:0;background:none;padding:2px 6px;font-family:var(--display);font-weight:800;font-size:clamp(30px,calc(var(--vw)*3.6),56px);color:var(--wc);transform:rotate(var(--r));transition:transform .15s}
.word[aria-pressed="true"]{background:var(--wc);color:#fff;border-radius:16px;transform:rotate(var(--r)) scale(1.08)}
.soupimg{width:100%;max-width:520px;justify-self:center;border-radius:20px}
.chosen{background:var(--green-soft);border:3px solid var(--green);border-radius:18px;padding:12px 16px}

/* ---- lekker ---- */
.faces{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:clamp(8px,calc(var(--vw)*1.5),24px)}
.face{border:3px solid transparent;border-radius:22px;background:none;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;transition:transform .15s}
.face img{width:100%;max-width:170px;aspect-ratio:1;object-fit:contain}
.face b{font-family:var(--display);font-size:clamp(22px,calc(var(--vw)*2),30px);line-height:1;color:var(--orange-dark)}
.face:hover{transform:translateY(-4px)}
.face:active{transform:scale(.96)}
.bars{display:grid;grid-template-columns:repeat(5,1fr);gap:clamp(8px,calc(var(--vw)*1.5),24px);align-items:end;height:70px}
.bars span{background:var(--band);border-radius:10px 10px 3px 3px;min-height:4px;transition:height .3s}
.sortgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:20px}
.sortgrid.met{grid-template-columns:minmax(0,1fr) 260px}
.sortl{display:flex;flex-direction:column;gap:12px;min-width:0}
.sortbeeld{width:100%;height:100%;max-height:340px;object-fit:contain;align-self:center}   /* altijd het hele plaatje, nooit bijsnijden */
@media (max-width:820px){.sortgrid.met{grid-template-columns:1fr}.sortbeeld{max-height:180px;order:-1}}

/* ---- speur ---- */
.kitchen{display:grid;grid-template-columns:1.25fr 1fr;gap:clamp(16px,calc(var(--vw)*3),40px);align-items:start}
.tray{display:grid;grid-template-columns:repeat(var(--cols,5),minmax(0,1fr));gap:clamp(8px,calc(var(--vw)*1),14px)}
.ing,.card{border:3px solid var(--orange);border-radius:18px;background:var(--card);padding:6px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:var(--display);font-weight:800;font-size:clamp(16px,calc(var(--vw)*1.5),24px);touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;position:relative;transition:transform .15s,opacity .2s}
.ing img,.card img{width:100%;aspect-ratio:1;object-fit:contain;pointer-events:none}
.ing img{padding:8%}
.ing span,.card span{pointer-events:none;text-align:center;line-height:1.1;max-width:100%;overflow-wrap:break-word}
.ing span{min-height:2.2em;display:flex;align-items:center;justify-content:center}
.ing:not(:disabled):hover,.card:not(:disabled):hover{transform:translateY(-3px) rotate(-1.5deg)}
.ing.wrong{opacity:.35;cursor:default;border-color:var(--line)}
.ing.wrong::after{content:"×";position:absolute;top:4px;right:10px;color:var(--red);font-size:1.6em;line-height:1}
.ing.gone{border:3px dashed var(--line);background:transparent;min-height:120px}
.ing:disabled:not(.wrong){cursor:default}
.lifted{opacity:.3}
.shake{animation:shake .4s}
.ghost-drag{position:fixed;z-index:30;width:120px;height:120px;translate:-50% -50%;pointer-events:none;rotate:-8deg;filter:drop-shadow(0 10px 8px rgba(59,43,34,.3))}
.ghost-drag img{width:100%;height:100%;object-fit:contain}
.ghost-drag .gtext{background:var(--paper);border:3px solid var(--orange);border-radius:14px;padding:6px 12px;font-size:17px;white-space:nowrap;display:inline-block;translate:-25% 30%}
.panwrap{display:flex;flex-direction:column;gap:10px}
.pan{position:relative;border-radius:24px;padding:8px;transition:background .2s}
.hover{background:#FFE9A8!important;outline:4px dashed var(--orange)}
.panart{display:block;width:88%;height:auto;margin:16% auto 0}
.plons .panart{animation:plons .45s}
.floaters{position:absolute;left:12%;right:12%;top:2%;height:34%;display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-end;gap:0 2%}
.floaters img{height:62%;max-width:16%;object-fit:contain;animation:bob 2.4s ease-in-out infinite;filter:drop-shadow(0 6px 4px rgba(59,43,34,.25))}
.floaters img:nth-child(2n){animation-delay:.6s}

/* ---- kernvraag ---- */
.kern{display:grid;grid-template-columns:1.6fr 1fr;gap:clamp(16px,calc(var(--vw)*3),40px);align-items:start}
.kernside{display:flex;flex-direction:column;gap:14px;min-width:0}
.vote{flex-direction:column;align-items:stretch}
.detbox{position:relative;border-radius:20px;overflow:hidden;aspect-ratio:16/9;background:center/cover no-repeat;max-width:100%}
.detbox .ans{position:absolute;left:3%;top:6%;bottom:6%;width:46%;background:rgba(185,82,15,.88);color:#fff;border-radius:18px;padding:clamp(10px,calc(var(--vw)*1.4),20px);font-size:clamp(14px,calc(var(--vw)*1.3),20px);display:flex;flex-direction:column;gap:.6em;overflow:auto}
.detbox .ans h3{font-size:1.4em;color:var(--sun)}
.vote{display:flex;gap:10px;flex-wrap:wrap}
.vote button{border:3px solid var(--orange);background:var(--paper);border-radius:16px;padding:8px 16px;display:flex;gap:8px;align-items:center}
.vote button b{font-family:var(--display);background:var(--orange);color:#fff;border-radius:50%;width:32px;height:32px;display:grid;place-items:center;flex:none}
.vote button em{font-style:normal;color:var(--muted)}
.bodies{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.body{position:relative;border:3px solid var(--orange);border-radius:20px;background:var(--card);padding:10px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.body img{width:clamp(100px,calc(var(--vw)*12),180px);aspect-ratio:1;object-fit:contain}
.body small{font-size:.75em;line-height:1.3;font-weight:600}
.body.yes{background:var(--green-soft);border-color:var(--green)}
.body.nope{border-color:var(--line);opacity:.75}
.mark{position:absolute;top:-14px;right:10px;border-radius:999px;padding:0 12px;font-family:var(--display);font-weight:800;transform:rotate(4deg)}
.mark.ok{background:var(--green);color:#fff}
.mark.no{background:var(--paper);color:var(--red);border:2px solid var(--red)}
.items{display:flex;gap:10px;flex-wrap:wrap}
.item{border:3px solid var(--orange);border-radius:16px;background:var(--paper);padding:8px 14px;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;text-align:left;max-width:100%}
.item.sel{background:var(--sun);border-color:var(--sun);transform:translateY(-3px) rotate(-1.5deg)}
.bins{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bin{border:3px solid var(--bc);border-radius:20px;background:var(--card);padding:10px;min-height:140px;display:flex;flex-direction:column;gap:8px;text-align:left}
.bin h3{color:var(--bc);text-align:center;font-size:clamp(24px,calc(var(--vw)*2.2),34px)}
.placed{background:var(--paper);border:2px solid var(--bc);border-radius:12px;padding:6px 10px;font-size:.85em;animation:pop .3s}
.placed small{display:block;font-weight:600;color:var(--muted)}

/* ---- koppelen (bv. wortelrassen) ---- */
.match{display:grid;grid-template-columns:1.1fr 1fr;gap:clamp(16px,calc(var(--vw)*3),40px);align-items:start}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.card.sel{background:var(--sun);border-color:var(--sun);transform:translateY(-4px) rotate(-2deg)}
.card.paired{border-color:var(--green);background:var(--green-soft);cursor:default}
.names{display:grid;grid-template-columns:1fr;gap:8px}
.name{border:3px solid var(--line);border-radius:16px;background:var(--paper);padding:8px 14px;text-align:left;display:flex;align-items:center;gap:10px}
.name b{font-family:var(--display);font-size:1.25em;color:var(--orange-dark);line-height:1}
.name small{display:block;font-weight:600;font-size:.82em}
.name img{width:52px;height:52px;flex:none;border-radius:10px}
.name.done{border-color:var(--green);background:var(--green-soft);cursor:default}
.name.done b{color:var(--green)}

/* ---- quiz ---- */
.quiz{display:grid;grid-template-columns:1fr 1.1fr;gap:clamp(16px,calc(var(--vw)*3),40px);align-items:start}
.quiz figure{margin:0}
.quiz figure img{width:100%;border-radius:20px;display:block}
.qcount{color:var(--muted)}
.opts{display:flex;flex-direction:column;gap:12px}
.opt{border:3px solid var(--orange);border-radius:18px;background:var(--paper);padding:10px 14px;display:flex;align-items:center;gap:14px;text-align:left;position:relative;transition:opacity .3s,transform .3s}
.opt .l{font-family:var(--display);font-weight:800;font-size:1.6em;width:52px;height:52px;border-radius:14px;background:var(--orange);color:#fff;display:grid;place-items:center;flex:none}
.opt:not(:disabled):hover{transform:translateX(4px)}
.opt:disabled{cursor:default}
.opts.revealed .opt{opacity:.35}
.opts.revealed .opt.good{opacity:1;border-color:var(--green);background:var(--green-soft)}
.opts.revealed .opt.good .l{background:var(--green)}
.opts.revealed .opt.bad{opacity:1;border-color:var(--red);background:var(--red-soft);animation:shake .4s}
.opts.revealed .opt.bad .l{background:var(--red)}
.fact{border-radius:18px;padding:14px 18px;background:var(--green-soft);border:3px solid var(--green);display:flex;flex-direction:column;gap:4px}
.fact b{font-family:var(--display);font-size:1.2em;color:var(--green)}
.fact.miss{background:var(--red-soft);border-color:var(--red)}
.fact.miss b{color:var(--red)}

/* ---- kunst ---- */
.art{display:grid;grid-template-columns:1.4fr 1fr;gap:clamp(18px,calc(var(--vw)*3),40px);align-items:start}
.frame{margin:0;display:flex;flex-direction:column;gap:8px}
.imgbtn{border:14px solid var(--orange);border-radius:4px;background:#2a2118;padding:0;display:block;width:100%;cursor:zoom-in}
.imgbtn img{display:block;width:100%;height:auto}
figcaption{font-size:.85em;color:var(--muted)}
figcaption b{color:var(--ink)}
.look{display:flex;flex-direction:column;gap:10px;padding:0;margin:0;list-style:none}
.look li{border:3px solid var(--line);border-radius:16px;padding:10px 14px;display:flex;gap:12px;align-items:flex-start;background:var(--paper)}
.look .k{flex:none;width:38px;height:38px;border-radius:50%;background:var(--purple);color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:20px}
.look li.hid{border-style:dashed;background:transparent;color:var(--muted);align-items:center}
.look li.hid .k{background:var(--line)}
.lq{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.expl{background:#EFE7F7;border-radius:12px;padding:8px 12px;font-size:.88em;font-weight:600}
.expl b{display:block;color:var(--purple);font-weight:800}
.small{padding:4px 14px;font-size:.85em}
.lightbox{position:fixed;inset:0;z-index:20;background:rgba(30,20,14,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:max(24px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.lightbox img{max-width:100%;max-height:calc(100% - 80px);object-fit:contain;border:10px solid var(--orange)}

/* ---- creatief ---- */
.create{display:grid;grid-template-columns:1fr 1.15fr;gap:clamp(16px,calc(var(--vw)*3),40px);align-items:start}
.assign{display:flex;flex-direction:column;gap:14px}
.tag{align-self:flex-start;background:var(--green);color:#fff;border-radius:999px;padding:2px 14px;font-size:.85em}
.assign ol{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:10px;font-size:1.08em}
.assign li::marker{font-family:var(--display);font-weight:800;color:var(--orange)}
.need{display:flex;gap:8px;flex-wrap:wrap}
.need span{border:2px solid var(--orange);border-radius:999px;padding:2px 12px;background:var(--paper);font-size:.85em}
.example{margin:0;display:flex;flex-direction:column;gap:6px;align-items:center}
.example img{width:100%;border-radius:12px;display:block}
.example figcaption{color:var(--green);font-style:italic;font-size:1em}

/* ---- nav ---- */
.nav{display:flex;justify-content:space-between;gap:12px}
.nav button{border-radius:999px;padding:10px 30px;font-weight:800;border:3px solid var(--orange);background:var(--paper);color:var(--orange-dark)}
.nav .next{background:var(--orange);color:#fff}
.nav button:disabled{opacity:.35;cursor:default}

.confetti{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:12px;height:18px;border-radius:3px;animation:fall 1.6s ease-in forwards}

@keyframes shake{0%,100%{translate:0}25%{translate:-8px}75%{translate:8px}}
@keyframes plons{35%{transform:translateY(6px) scale(1.02,.97)}}
@keyframes bob{50%{transform:translateY(-6px)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}

@media (max-width:820px){
  .taste,.kitchen,.kern,.match,.quiz,.art,.create{grid-template-columns:1fr}
  .tray,.cards{grid-template-columns:repeat(4,1fr)}
  .cover{background:var(--cover) top center/100% auto no-repeat;padding-top:calc(var(--vw)*44);align-items:flex-start}
  .cover::before{background:linear-gradient(180deg,rgba(255,244,214,0) 0,rgba(255,244,214,0) calc(var(--vw)*38),var(--cream) calc(var(--vw)*56))}
  .detbox{aspect-ratio:auto;min-height:420px;background-position:75% center}
  .detbox .ans{position:relative;left:auto;top:auto;bottom:auto;width:auto;margin:12px}
}
@media (max-width:520px){
  .tray,.cards{grid-template-columns:repeat(2,1fr)}
  .faces{grid-template-columns:repeat(3,1fr)}
  .bars{display:none}
  .bodies{grid-template-columns:repeat(2,1fr)}
  .bins{grid-template-columns:1fr}
  .level button{padding:6px 12px;font-size:14px}
}

/* ---- onderbouw: alles groot en laag op het bord ---- */
.juf{margin:auto 0 0;max-width:none;font-size:.82em;font-weight:600;color:var(--muted);border-top:2px dashed var(--line);padding-top:10px}
.juf b{color:var(--orange-dark)}
.emo{font-size:clamp(56px,calc(var(--vw)*6),96px);line-height:1}
.vlek{display:block;width:clamp(80px,calc(var(--vw)*9),140px);aspect-ratio:1;border-radius:50%;box-shadow:inset 0 -8px 0 rgba(0,0,0,.12)}
.obdots{display:flex;gap:8px}
.obdots i{width:18px;height:18px;border-radius:50%;border:3px solid var(--orange);background:var(--paper)}
.obdots i.on{background:var(--orange)}
.obkeuze{display:grid;grid-template-columns:repeat(var(--n),minmax(0,220px));gap:clamp(12px,calc(var(--vw)*2),32px);justify-content:center;margin-top:auto}
.obknop{border:4px solid var(--orange);border-radius:24px;background:var(--paper);padding:16px 10px;display:flex;flex-direction:column;align-items:center;gap:10px;font-family:var(--display);font-size:clamp(22px,calc(var(--vw)*2.2),32px);transition:transform .15s}
.obknop:hover{transform:translateY(-3px)}
.obknop{position:relative}
.obknop.gekozen{border-color:var(--green);border-width:6px;box-shadow:0 0 0 6px var(--green-soft);transform:scale(1.06)}
.obknop.gekozen::after{content:"✓";position:absolute;top:-14px;right:-14px;width:40px;height:40px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-size:24px}
.obantw{display:flex;align-items:center;gap:16px;justify-content:center;font-size:1.3em}
.obantw img{width:130px;height:130px;max-width:none;object-fit:contain;flex:none}
.obraad{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:24px;align-items:center;flex:1 1 auto;min-height:0}
.obspel{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:24px;align-items:center;min-height:0;height:100%}
.obschaduw{border:4px solid var(--orange);border-radius:28px;background:var(--card);padding:16px;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;min-height:0;font-family:var(--display);font-size:clamp(28px,calc(var(--vw)*3),46px)}
.obschaduw img{flex:1 1 0;min-height:0;width:100%;max-height:420px;object-fit:contain;filter:brightness(0) opacity(.8);transition:filter .6s}
.obschaduw.onthuld img{filter:none}
.obschaduw b{line-height:1}
.obzij{display:flex;flex-direction:column;gap:18px;align-items:flex-start}
.obgroot{font-size:clamp(24px,calc(var(--vw)*2.4),34px);padding:14px 32px}
.objanee{display:flex;gap:18px}
.objanee .obknop{width:170px}
.obfb{border-radius:18px;padding:12px 18px;font-size:1.15em;border:3px solid}
.obfb.ok{background:var(--green-soft);border-color:var(--green)}
.obfb.no{background:var(--red-soft);border-color:var(--red);color:var(--red)}
.obpan{position:relative;align-self:end}
.obpan>img{width:100%;max-height:360px;object-fit:contain;display:block}
.obinpan{position:absolute;left:14%;right:14%;top:0;height:40%;display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-end}
.obinpan img{height:70%;max-width:24%;object-fit:contain;animation:bob 2.4s ease-in-out infinite}
.obklaar{display:flex;flex-wrap:wrap;gap:16px;justify-content:center}
.obklaar figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:6px;font-family:var(--display);font-size:26px}
.obklaar img{height:150px;width:150px;object-fit:contain}
.obitems{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:12px}
.obitem{border:4px solid var(--orange);border-radius:20px;background:var(--paper);padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;font-family:var(--display);font-size:22px;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.obitem img{width:100%;height:120px;object-fit:contain;pointer-events:none}
.obitem .emo{height:120px;display:flex;align-items:center;pointer-events:none;font-size:92px}
.obitem b{pointer-events:none}
.obitem.sel{background:var(--sun);border-color:var(--sun);transform:translateY(-4px) rotate(-2deg)}
.obbakken{display:grid;grid-template-columns:1fr 1fr;gap:20px;flex:1 1 auto;min-height:150px}
.obbak{border:4px solid var(--bc);border-radius:26px;background:var(--card);padding:12px;display:flex;flex-direction:column;gap:10px;align-items:stretch}
.obbak h3{color:var(--bc);font-size:clamp(28px,calc(var(--vw)*2.6),40px);display:flex;gap:12px;justify-content:center;align-items:center}
.obbak h3 span{font-size:1.3em}
.obbakin{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center}
.obmini img{width:72px;height:72px;object-fit:contain}
.obmini .emo{font-size:58px}
.obdoen{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
.obkaart{border:3px solid var(--orange);border-radius:22px;background:var(--paper);padding:18px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.obkaart h3{font-size:26px;color:var(--orange-dark)}
.obkaart p{font-size:.92em;font-weight:600}
html.dia .obles{gap:18px}
html.dia .obles.lekker .face img{max-width:170px}
html.dia .obraad{flex:1 1 0}
@media (max-width:820px){
  .obraad,.obspel{grid-template-columns:1fr}
  .obitems{grid-template-columns:repeat(4,minmax(0,1fr))}
  .obdoen{grid-template-columns:1fr 1fr}
  .obkeuze{grid-template-columns:repeat(2,minmax(0,1fr))}
}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---- DIA-MODUS: liggende schermen (digibord, laptop). De hele app is één vaste dia van 1600 breed
   die als geheel meeschaalt, zodat alles altijd in beeld past. Staande telefoon: gewone scrollpagina. ---- */
html.dia,html.dia body{height:100%;overflow:hidden}
html.dia .app{position:fixed;left:50%;top:50%;width:1600px;max-width:none;margin:0;min-height:0;padding:14px 26px 16px;transform-origin:center center}
html.dia .stage{min-height:0;overflow:auto}
html.dia .stage>.inner{flex:1;min-height:0}
html.dia .cover{min-height:0}
/* compactere kop en randen */
html.dia .band{padding:16px 44px}
html.dia .band h2{font-size:46px}
html.dia .inner{padding:22px 44px 24px;gap:16px}
html.dia .say img{width:60px;height:60px}
/* beginscherm: 4 kolommen, 2 rijen, plaatjes vullen de hoogte */
html.dia .kiezer{flex:1 1 0;min-height:0}
html.dia .klaarrij{flex:1 1 0;min-height:0;grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(0,400px)}   /* beschikbare soepen groot */
html.dia .laterrij{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr)}                             /* binnenkort: kleine rij */
html.dia .soepkaart{min-height:0;padding:14px 14px 16px}
html.dia .klaarrij .soepkaart img{flex:1 1 0;min-height:0;aspect-ratio:auto}
/* hoe lekker: balkjes krijgen alle vrije ruimte, smileys en tekst schuiven naar onder */
html.dia .lekker .bars{flex:1 1 0;height:auto;min-height:80px}
html.dia .lekker .face{padding:4px 6px}
html.dia .lekker .face img{max-width:140px}
html.dia .sortgrid{flex:1 1 0;min-height:0}
html.dia .sortbeeld{max-height:none;min-height:0}
/* het hoofdblok van elk scherm vult de resterende hoogte; plaatjes passen zich aan die hoogte aan */
html.dia :is(.taste,.kitchen,.kern,.match,.quiz,.art,.create){flex:1 1 0;min-height:0;grid-template-rows:minmax(0,1fr);align-items:stretch}
html.dia :is(.taste,.kitchen,.kern,.match,.quiz,.art,.create)>*{min-height:0}
/* proeven */
html.dia .cloud{align-self:center}
html.dia .soupimg{width:100%;height:100%;max-width:none;object-fit:contain}
/* speur: vaste rasters, alle vakjes en plaatjes even groot */
html.dia .tray{max-height:100%;aspect-ratio:calc(var(--cols,5) / var(--rows,3) * .8);grid-template-rows:repeat(var(--rows,3),minmax(0,1fr));align-self:start}
html.dia .ing{min-height:0;justify-content:space-between}
html.dia .ing{padding:8px 6px 6px}
html.dia .ing img{flex:1 1 0;min-height:0;width:100%;aspect-ratio:auto;padding:4px}
html.dia .ing{container-type:inline-size}
html.dia .ing span{font-size:min(21px,13.5cqi)}   /* naam schaalt mee met het vakje: "Bleekselderij" past altijd */
html.dia .ing.gone{min-height:0}
html.dia .panwrap{height:100%;min-height:0}
html.dia .pan{flex:1 1 0;min-height:0;aspect-ratio:1;max-width:100%;align-self:center}
html.dia .panart{width:auto;height:84%;margin:12% auto 0}
/* kernvraag */

/* lichaam */
html.dia .bodies{grid-template-columns:repeat(var(--n,6),minmax(0,1fr))}
html.dia .body img{width:100%;height:120px}
html.dia .items{gap:8px}

html.dia .bin{min-height:110px;padding:8px}
html.dia .bin h3{font-size:30px}
html.dia .placed{padding:3px 10px;font-size:.8em;line-height:1.25}
html.dia .bin{gap:6px}
html.dia .onthoud{padding:12px 18px}
/* koppelen */
html.dia .cards{max-height:100%;aspect-ratio:calc(var(--kcols,4) / var(--rows,2) * .85);grid-template-rows:repeat(var(--rows,2),minmax(0,1fr));align-self:start}
html.dia .card{min-height:0;justify-content:space-between}
html.dia .card img{flex:1 1 0;min-height:0;width:100%;aspect-ratio:auto}

html.dia .name{padding:6px 12px}
html.dia .name b{font-size:1.15em}
html.dia .name small{font-size:.78em}

html.dia .quiz figure{height:100%;display:flex;align-items:flex-start}

/* kunst: het schilderij past zich aan de hoogte aan, lijst blijft om het schilderij */
html.dia .frame{height:100%;min-height:0}

<body>
<div class="app">
  <header class="top">
    <button class="brand" id="home" aria-label="Naar het begin">
      <img id="brandImg" src="img/ingredienten/wortel.webp" alt="">
      <span><b>Soepdetective</b><small id="sub">Kies een soep</small></span>
    </button>
    <div class="level" role="group" aria-label="Niveau">
      <button data-niveau="g12" aria-pressed="false">Groep 1-2</button>
      <button data-niveau="g56" aria-pressed="true">Groep 5-6</button>
      <button data-niveau="g78" aria-pressed="false">Groep 7-8</button>
    </div>
  </header>
  <div class="stepsWrap" id="stepsWrap" hidden><nav class="steps" id="steps" aria-label="Onderdelen van de les"></nav></div>
  <main class="stage" id="stage" aria-live="polite"></main>
  <footer class="nav">
    <button id="prev">Vorige</button>
    <button id="next" class="next">Volgende</button>
  </footer>
</div>

<script src="soepen/soepen.js"></script>
<script>
/* ============ INHOUD ============
   De lesinhoud staat NIET hier, maar per soep in soepen/<id>/les.js.
   Overzicht van alle soepen + gedeelde ingrediënten: soepen/soepen.js.
   ================================= */
let LES = null;   // de les van de gekozen soep (LESSEN[state.soep])

/* ============ STAAT ============ */
const vers = () => ({ obStem:[0,0,0], obQ:0, obKeus:{}, obI:0, obOnthuld:false, obAntw:null, obPan:[], obGeplaatst:{}, obSel:null, obSchud:null, obMelding:null,
  woorden:new Set(), stemmen:[0,0,0,0,0], inPan:new Set(), fout:new Set(), volgorde:null, melding:null, schud:null, plons:false,
  wat:[0,0,0], kernOpen:false, kaartOpen:new Set(), geplaatst:{}, sortSel:null, sortVolgorde:null, sortMelding:null, sortSchud:null,
  paren:new Set(), sel:null, naamVolgorde:null, rasMelding:null, misser:null, q:0, gekozen:null, kijk:0, uitleg:new Set(), groot:false });
const state = { niveau:"g56", soep:null, scherm:-1, ...vers() };
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const L = x => (x && typeof x==="object" && "g56" in x) ? x[state.niveau] : x;
const shuffle = a => { for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const pad = {
  soep: n => `soepen/${state.soep}/img/${n}.webp`,   // alleen voor deze soep
  ing:  k => `img/ingredienten/${k}.webp`,           // gedeeld door alle soepen
  lijf: k => `img/lichaam/${k}.webp`,
  alg:  n => `img/algemeen/${n}.webp`
};
const img = (src, alt="") => `<img src="${src}" alt="${esc(alt)}" draggable="false">`;
const zeg = (t, soort="") => `<div class="say ${soort}"><img src="${pad.ing(LES ? LES.mascotte : "wortel")}" alt=""><div class="bubble">${t}</div></div>`;
const verder = () => { const n = stappen()[state.scherm+1]; return n ? `<button class="btn" data-go="${state.scherm+1}">Verder: ${esc(n.naam)}</button>` : ""; };
/* raster voor de ingrediënten: 2 rijen tot 10 stuks, daarna 3 (bv. 11 → 4×3, 13 → 5×3) */
const raster = n => { const rows = n<=10 ? 2 : 3; return { rows, cols: Math.ceil(n/rows) }; };
const band = t => `<div class="band"><h2>${esc(t)}</h2></div>`;
const koppelLijst = () => { const k=LES.koppel; return state.niveau==="g56" && k.g56 ? k.lijst.filter(x=>k.g56.includes(x.key)) : k.lijst; };

function confetti(){
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c=document.createElement("div"); c.className="confetti";
  const kl=["#F9C406","#F47B20","#EE6A56","#E41D9A","#4F8F3A","#7650A6"];
  for(let i=0;i<60;i++){ const s=document.createElement("i"); s.style.left=Math.random()*100+"%"; s.style.background=kl[i%kl.length]; s.style.animationDelay=(Math.random()*.5)+"s"; c.appendChild(s); }
  document.body.appendChild(c); setTimeout(()=>c.remove(),2400);
}
const pan = () => `<img class="panart" src="${pad.soep("pan")}" alt="Een pan met ${esc(LES.naam.toLowerCase())}" draggable="false">`;

/* ============ SCHERMEN ============ */
const SCHERM = {};
SCHERM.kiezer = () => {
  const kaart = s => `<button class="soepkaart" style="--kleur:${s.kleur||"var(--card)"}" data-soep="${s.id}"><img src="soepen/${s.id}/img/soep.webp" alt="" draggable="false"><b>${esc(s.naam)}</b></button>`;
  const later = s => `<div class="soepkaart later" style="--kleur:${s.kleur||"var(--card)"}" aria-disabled="true"><b>${esc(s.naam)}</b><small>binnenkort</small></div>`;
  return band("Welke soep onderzoeken we vandaag?") + `<div class="inner">
  <div class="kiezer">
    <div class="klaarrij">${SOEPEN.filter(s=>s.klaar).map(kaart).join("")}</div>
    ${SOEPEN.some(s=>!s.klaar) ? `<div class="laterrij">${SOEPEN.filter(s=>!s.klaar).map(later).join("")}</div>` : ""}
  </div>
  ${state.laadFout ? zeg(esc(state.laadFout),"no") : ""}</div>`;
};
SCHERM.start = () => `<section class="cover" style="--cover:url('${pad.soep("cover")}')">
  <div class="coverText">
    <h1>Soepdetective: ${esc(LES.naam)}</h1>
    ${state.niveau==="g12" ? `<p class="kv"><span>Kleuterles · ongeveer 15 minuten</span>Wat hebben we vandaag gegeten?</p>` : `<p class="kv"><span>Speurvraag van vandaag</span>${esc(LES.speurvraag)}</p>`}
    <button class="big" data-go="0">Start de les</button>
    <button class="ghost small" data-kies>Andere soep kiezen</button>
  </div></section>`;

SCHERM.proef = () => {
  const p = LES.proef, w = L(p.woorden);
  const cloud = w.map(([t,c,r])=>`<button class="word" style="--wc:${c};--r:${r}" data-word="${t}" aria-pressed="${state.woorden.has(t)}">${t}</button>`).join("");
  const g = [...state.woorden];
  return band(p.titel) + `<div class="inner">
    ${zeg(esc(L(p.vraag)))}
    <div class="taste">
      <div class="cloud">${cloud}</div>
      ${img(pad.soep("soep"),"Een kom "+LES.naam.toLowerCase()).replace("<img","<img class=\"soupimg\"")}
    </div>
    ${g.length ? `<div class="chosen">Onze soep is ${g.map(esc).join(", ")}.</div>` : ""}
    <div class="row">${verder()}</div></div>`;
};

SCHERM.lekker = () => {
  const l = LES.lekker, max = Math.max(1,...state.stemmen);
  return band(l.titel) + `<div class="inner lekker">
    <div class="bars" aria-hidden="true">${state.stemmen.map(n=>`<span style="height:${Math.round(n/max*100)}%"></span>`).join("")}</div>
    <div class="faces">${l.gezichten.map(([n,f],i)=>`<button class="face" data-vote="${i}" aria-label="${n}: één stem erbij">${img(pad.alg(f))}<b>${state.stemmen[i]}</b>${n}</button>`).join("")}</div>
    ${zeg(esc(L(l.vertel)))}
    <div class="row"><button class="ghost" id="voteReset">Opnieuw tellen</button>${verder()}</div></div>`;
};

SCHERM.speur = () => {
  const d = LES.speur;
  if (!state.volgorde) state.volgorde = shuffle([...d.goed,...L(d.fout)]);
  const n=d.goed.length, gev=d.goed.filter(k=>state.inPan.has(k)).length, klaar=gev===n;
  const tray = state.volgorde.map(k=>{
    if (state.inPan.has(k)) return `<div class="ing gone" aria-hidden="true"></div>`;
    const fout = state.fout.has(k);
    return `<button class="ing ${fout?"wrong":""} ${state.schud===k?"shake":""}" data-ing="${k}" ${fout||klaar?"disabled":""} aria-label="${INGREDIENTEN[k]} in de pan doen">${img(pad.ing(k))}<span>${INGREDIENTEN[k]}</span></button>`;
  }).join("");
  const msg = klaar ? zeg(esc(d.opgelost),"win")
    : state.melding ? zeg(esc(state.melding.t), state.melding.ok?"ok":"no")
    : zeg(esc(L(d.hint)));
  const h = band(d.titel) + `<div class="inner"><div class="kitchen">
    <div class="tray" style="--cols:${raster(state.volgorde.length).cols};--rows:${raster(state.volgorde.length).rows}">${tray}</div>
    <div class="panwrap">
      <div class="count"><span>In de soep: <b>${gev} van ${n}</b></span><span class="slots">${d.goed.map((_,i)=>`<span class="slot ${i<gev?"full":""}"></span>`).join("")}</span></div>
      <div class="pan ${state.plons?"plons":""}" id="pan">${pan()}<div class="floaters">${[...state.inPan].map(k=>img(pad.ing(k))).join("")}</div></div>
      ${msg}
    </div></div>
    <div class="row">${klaar ? verder() : `<button class="ghost" id="panAll">Toon het antwoord</button>`}<button class="ghost" id="panReset">Opnieuw</button></div></div>`;
  state.schud=null; return h;
};

SCHERM.speurvraag = () => {
  const k = LES.kern, opties = k.opties.map((t,i)=>[t,"ABC"[i]]);
  return band(k.titel) + `<div class="inner">
    <div class="kern">
      <div class="detbox" role="img" aria-label="${esc(k.beeldAlt)}" style="background-image:url('${pad.soep("detective")}')">
        ${state.kernOpen ? `<div class="ans"><h3>Opgelost!</h3>${k.antwoord.map(p=>`<p>${esc(p)}</p>`).join("")}</div>` : ""}
      </div>
      <div class="kernside">
        ${zeg(esc(k.wat))}
        <div class="vote">${opties.map(([t,l],i)=>`<button data-wat="${i}" aria-label="${t}: één stem erbij"><b>${l}</b>${t} <em>${state.wat[i]}</em></button>`).join("")}</div>
        <div class="row">${state.kernOpen ? verder() : `<button class="btn" id="kernOpen">Onthul het antwoord</button>`}</div>
      </div>
    </div></div>`;
};
SCHERM.lichaam = () => {
  const l = LES.lichaam, a = L(l.act), klaar = kernKlaar(a);
  return band(L(l.titel)) + `<div class="inner">
    ${a.type==="kaarten" ? zeg(esc(a.v)) + actKaarten(a) : actSorteer(a, zeg(esc(a.v)), l.plaatje)}
    ${klaar ? `<div class="onthoud"><b>Onthoud!</b><p>${esc(l.onthoud)}</p></div>` : ""}
    <div class="row">${klaar ? verder() : ""}</div></div>`;
};
function kernKlaar(a){
  if (a.type==="kaarten") return a.opties.filter(o=>o.goed).every(o=>state.kaartOpen.has(o.key));
  return a.items.every((_,i)=>state.geplaatst[i]);
}
function actKaarten(a){
  const goed = a.opties.filter(o=>o.goed), gev = goed.filter(o=>state.kaartOpen.has(o.key)).length, klaar = gev===goed.length;
  return `<div class="count"><span>Gevonden: <b>${gev} van ${goed.length}</b></span><span class="slots">${goed.map((_,i)=>`<span class="slot ${i<gev?"full":""}"></span>`).join("")}</span></div>
    <div class="bodies" style="--n:${a.opties.length}">${a.opties.map(o=>{ const open=state.kaartOpen.has(o.key);
      return `<button class="body ${open?(o.goed?"yes":"nope"):""}" data-kaart="${o.key}" ${open||klaar?"disabled":""}>${img(pad.lijf(o.key), o.naam)}<b>${esc(o.naam)}</b>
        ${open?`<small>${esc(o.uitleg)}</small><span class="mark ${o.goed?"ok":"no"}">${o.goed?"Klopt!":"Nee"}</span>`:""}</button>`; }).join("")}</div>
    ${klaar ? "" : `<div class="row"><button class="ghost" id="kaartAll">Toon het antwoord</button></div>`}`;
}
function actSorteer(a, opdracht, plaatje){
  if (!state.sortVolgorde) state.sortVolgorde = shuffle(a.items.map((_,i)=>i));
  const open = state.sortVolgorde.filter(i=>!state.geplaatst[i]);
  const n=a.items.length, gedaan=Object.keys(state.geplaatst).length;
  const msg = gedaan===n ? ""   /* klaar: confetti + "Onthoud!" zeggen genoeg, en zo past het op het bord */
    : state.sortMelding ? zeg(esc(state.sortMelding.t), state.sortMelding.ok?"ok":"no")
    : state.sortSel!==null ? zeg("Tik nu op het goede vak.") : "";
  const h = `<div class="sortgrid ${plaatje?"met":""}"><div class="sortl">${opdracht}<div class="count"><span>Geplaatst: <b>${gedaan} van ${n}</b></span></div>
    ${open.length?`<div class="items">${open.map(i=>`<button class="item ${state.sortSel===i?"sel":""} ${state.sortSchud===i?"shake":""}" data-item="${i}">${esc(a.items[i].naam)}</button>`).join("")}</div>`:""}
    <div class="bins">${a.bakken.map(b=>`<button class="bin" style="--bc:${b.kleur}" data-bak="${b.id}"><h3>${b.naam}</h3>${
      a.items.map((it,i)=>[it,i]).filter(([,i])=>state.geplaatst[i]===b.id).map(([it])=>`<div class="placed">${esc(it.naam)}${it.uitleg?`<small>${esc(it.uitleg)}</small>`:""}</div>`).join("")}</button>`).join("")}</div>
    ${msg}
    ${gedaan<n?`<div class="row"><button class="ghost" id="sortAll">Toon het antwoord</button></div>`:""}</div>
    ${plaatje ? `<img class="sortbeeld" src="${pad.soep(plaatje)}" alt="" draggable="false">` : ""}</div>`;
  state.sortSchud=null; return h;
}

SCHERM.koppel = () => {
  const r = LES.koppel, lijst = koppelLijst();
  if (!state.naamVolgorde) state.naamVolgorde = shuffle(lijst.map(x=>x.key));
  const klaar = state.paren.size===lijst.length;
  const cards = lijst.map(x=>{ const p=state.paren.has(x.key);
    return `<button class="card ${p?"paired":""} ${state.sel===x.key?"sel":""}" data-ras="${x.key}" ${p||klaar?"disabled":""} aria-label="${p?esc(x.naam):"Kies dit plaatje"}">${img(pad.soep("koppel-"+x.key))}<span>${p?esc(x.naam):"?"}</span></button>`; }).join("");
  const names = state.naamVolgorde.map(k=>{ const x=lijst.find(y=>y.key===k), p=state.paren.has(k);
    return `<button class="name ${p?"done":""} ${state.misser===k?"shake":""}" data-naam="${k}" ${p?"disabled":""}>${p?img(pad.soep("koppel-"+k)):""}<span><b>${esc(x.naam)}</b><small>${esc(x.hint)}</small></span></button>`; }).join("");
  const msg = klaar ? zeg(esc(r.slot),"win")
    : state.rasMelding ? zeg(esc(state.rasMelding.t), state.rasMelding.ok?"ok":"no")
    : state.sel ? zeg("Tik nu op de naam die erbij hoort.") : zeg(esc(L(r.v)));
  state.misser=null;
  return band(r.titel) + `<div class="inner">
    ${msg}
    <div class="count"><span>Gevonden: <b>${state.paren.size} van ${lijst.length}</b></span><span class="slots">${lijst.map((_,i)=>`<span class="slot ${i<state.paren.size?"full":""}"></span>`).join("")}</span></div>
    <div class="match"><div class="cards" style="${lijst.length<=4?"grid-template-columns:repeat(2,minmax(0,1fr));":""}--rows:${Math.ceil(lijst.length/(lijst.length<=4?2:4))};--kcols:${lijst.length<=4?2:4}">${cards}</div><div class="names" style="--ncol:${lijst.length>5?2:1}">${names}</div></div>
    <div class="row">${klaar ? verder() : `<button class="ghost" id="rasAll">Toon het antwoord</button>`}</div></div>`;
};

SCHERM.quiz = () => {
  const lijst = L(LES.quiz), q = lijst[state.q], done = state.gekozen!==null, juist = done && state.gekozen===q.goed;
  const last = state.q===lijst.length-1;
  return band("Wist je dat…") + `<div class="inner">
    <span class="qcount">Vraag ${state.q+1} van ${lijst.length}</span>
    <h2 style="font-size:clamp(26px,2.8vw,42px)">${esc(q.v)}</h2>
    <div class="quiz">
      <figure>${img(pad.soep(q.img),"")}</figure>
      <div style="display:flex;flex-direction:column;gap:14px;min-width:0">
        <div class="opts ${done?"revealed":""}">${q.a.map((t,i)=>{
          const cls = done && i===q.goed ? "good" : done && i===state.gekozen ? "bad" : "";
          return `<button class="opt ${cls}" data-ans="${i}" ${done?"disabled":""}><span class="l">${"ABC"[i]}</span><span>${esc(t)}</span></button>`; }).join("")}</div>
        ${done ? `<div class="fact ${juist?"":"miss"}"><b>${juist?"Goed zo!":"Bijna! Het goede antwoord is "+"ABC"[q.goed]+"."}</b><p>${esc(q.weetje)}</p></div>`
               : zeg("Kies samen A, B of C. Tik daarna op het antwoord van de klas.")}
        <div class="row">${done ? (last ? verder() : `<button class="btn" id="nextQ">Volgende vraag</button>`) : ""}${state.q>0?`<button class="ghost" id="prevQ">Vorige vraag</button>`:""}</div>
      </div>
    </div></div>`;
};

SCHERM.kunst = () => {
  const k = LES.kunst, vr = L(k.vragen);
  const items = vr.map((v,i)=>{
    if (i>=state.kijk) return `<li class="hid"><span class="k">${i+1}</span><span>Kijkvraag ${i+1}</span></li>`;
    const ex = state.uitleg.has(i) ? `<div class="expl"><b>Kijk mee</b>${esc(v.uitleg)}</div>` : `<button class="ghost small" data-expl="${i}">Kijk mee</button>`;
    return `<li><span class="k">${i+1}</span><div class="lq"><span>${esc(v.v)}</span>${ex}</div></li>`;
  }).join("");
  return band(k.titel) + `<div class="inner"><div class="art">
    <figure class="frame">
      <button class="imgbtn" id="zoom" aria-label="Schilderij groot tonen">${img(pad.soep("kunst"),k.werk+", geschilderd door "+k.maker)}</button>
      <figcaption><b>${esc(k.werk)}</b> · ${k.maker}, ${k.jaar} · ${k.plek}. Tik op het schilderij om het groot te zien.</figcaption>
    </figure>
    <div style="display:flex;flex-direction:column;gap:14px;min-width:0">
      <p>${esc(k.intro)}</p>
      <ol class="look">${items}</ol>
      <div class="row">${state.kijk<vr.length ? `<button class="btn" id="kijkNext">${state.kijk===0?"Eerste kijkvraag":"Volgende kijkvraag"}</button>` : verder()}</div>
    </div></div>
    ${state.groot ? `<div class="lightbox">${img(pad.soep("kunst"),k.werk)}<button class="ghost" id="closeZoom">Sluiten</button></div>` : ""}</div>`;
};

SCHERM.maak = () => {
  const m = LES.maak;
  return band(m.titel) + `<div class="inner"><div class="create">
    <div class="assign">
      <span class="tag">Optioneel</span>
      <ol>${L(m.stappen).map(s=>`<li>${esc(s)}</li>`).join("")}</ol>
      <div class="label">Wat heb je nodig?</div>
      <div class="need">${m.nodig.map(s=>`<span>${s}</span>`).join("")}</div>
      ${m.zeg ? zeg(esc(m.zeg)) : ""}
    </div>
    <figure class="example">${img(pad.soep("voorbeeld"),m.voorbeeldAlt)}<figcaption>Voorbeeld</figcaption></figure>
  </div></div>`;
};


/* ============ ONDERBOUW (groep 1-2) ============
   Korte kleuterles na het eten van de soep. Alleen plaatjes op het bord; onderaan staat
   per dia een regel voor de leerkracht. Wat per soep verschilt staat in les.js onder
   `onderbouw` (kleur, textuur, raad); de rest is voor elke soep hetzelfde.
   TIJDELIJK: emoji als plaatjes voor zon/sneeuw/snoep enz., later vervangen door tekeningen. */
const STAPPEN_OB = [
  {id:"ob-lekker", naam:"Hoe lekker?"},
  {id:"ob-proef",  naam:"Wat proefde je?"},
  {id:"ob-raad",   naam:"Wie ben ik?"},
  {id:"ob-kies",   naam:"Elke dag of af en toe?"},
  {id:"ob-doen",   naam:"Aan de slag"}
];
const stappen = () => state.niveau==="g12" ? STAPPEN_OB : LES.stappen;
const juf = t => `<p class="juf"><b>Vraag aan de klas:</b> ${t}</p>`;
const ob = () => LES.onderbouw || {};
const KLEUREN = { oranje:"#F47B20", rood:"#D1352B", groen:"#4F8F3A", geel:"#F9C406" };
const obRaad = () => { const o=ob(); if (o.raad) return o.raad;
  const goed=[LES.mascotte, ...LES.speur.goed.filter(k=>k!==LES.mascotte && !["water","zout"].includes(k))].slice(0,4);
  const fout=(LES.speur.fout.g56||LES.speur.fout).slice(0,2); return [goed[0], fout[0], goed[1], goed[2], fout[1], goed[3]].filter(Boolean); };
const obVragen = () => { const o=ob(); return [
  { v:"Welke kleur had de soep?", juf:"Welke kleur had de soep? Wie weet het nog?",
    opties:Object.entries(KLEUREN).map(([n,c])=>({k:n, naam:n, beeld:`<span class="vlek" style="background:${c}"></span>`})), goed:o.kleur },
  { v:"Was de soep warm of koud?", juf:"Was de soep warm of koud? Hoe voelde dat in je mond?",
    opties:[{k:"warm",naam:"warm",beeld:`<span class="emo">☀️</span>`},{k:"koud",naam:"koud",beeld:`<span class="emo">❄️</span>`}], goed:"warm" },
  { v:"Was de soep glad of met stukjes?", juf:"Was de soep glad, of zaten er stukjes in? Hoe voelde dat op je tong?",
    opties:[{k:"glad",naam:"glad",beeld:`<span class="emo">🥣</span>`},{k:"stukjes",naam:"met stukjes",beeld:`<span class="emo">🍲</span>`}], goed:o.textuur }
]; };
const KIES = () => [
  {k:"groente", naam:"groente",   beeld:img(pad.ing("broccoli")), bak:"dag"},
  {k:"snoep",   naam:"snoep",     beeld:`<span class="emo">🍭</span>`, bak:"soms"},
  {k:"fruit",   naam:"fruit",     beeld:img(pad.ing("aardbei")), bak:"dag"},
  {k:"chips",   naam:"chips",     beeld:`<span class="emo">🍟</span>`, bak:"soms"},
  {k:"water",   naam:"water",     beeld:img(pad.ing("water")), bak:"dag"},
  {k:"fris",    naam:"frisdrank", beeld:`<span class="emo">🥤</span>`, bak:"soms"},
  {k:"soep",    naam:"soep",      beeld:img(pad.soep("soep")), bak:"dag"},
  {k:"taart",   naam:"taart",     beeld:`<span class="emo">🍰</span>`, bak:"soms"}
];
const BAKKEN = [{id:"dag", naam:"Elke dag", emo:"🌞", kleur:"#4F8F3A"}, {id:"soms", naam:"Af en toe", emo:"🎉", kleur:"#7650A6"}];

SCHERM["ob-lekker"] = () => {
  const g=[["nog niet lekker","smiley-nietlekker"],["gaat wel","smiley-gaatwel"],["lekker","smiley-lekker"]], max=Math.max(1,...state.obStem);
  return band("Hoe lekker was de soep?") + `<div class="inner lekker obles">
    <div class="bars" aria-hidden="true" style="grid-template-columns:repeat(3,1fr)">${state.obStem.map(n=>`<span style="height:${Math.round(n/max*100)}%"></span>`).join("")}</div>
    <div class="faces" style="grid-template-columns:repeat(3,minmax(0,1fr))">${g.map(([n,f],i)=>`<button class="face" data-obstem="${i}" aria-label="${n}: één stem erbij">${img(pad.alg(f))}<b>${state.obStem[i]}</b>${n}</button>`).join("")}</div>
    <div class="row"><button class="ghost" id="obStemReset">Opnieuw tellen</button>${verder()}</div>
    ${juf("Kom naar het bord en tik op jouw gezichtje. Vond je hem nog niet lekker? Dat mag! Proeven is oefenen: misschien vind je hem de volgende keer wél lekker.")}</div>`;
};

SCHERM["ob-proef"] = () => {
  const vr=obVragen(), q=vr[state.obQ], keus=state.obKeus[state.obQ], laatste=state.obQ===vr.length-1;
  const goed = q.opties.find(o=>o.k===q.goed);
  return band(q.v) + `<div class="inner obles">
    <span class="obdots">${vr.map((_,i)=>`<i class="${i<=state.obQ?"on":""}"></i>`).join("")}</span>
    <div class="obkeuze" style="--n:${q.opties.length}">${q.opties.map(o=>`<button class="obknop ${keus===o.k?"gekozen":""}" data-obkeus="${o.k}">${o.beeld}<b>${esc(o.naam)}</b></button>`).join("")}</div>
    ${keus && goed ? `<div class="obantw">${img(pad.soep("soep"))}<span>De soep was <b>${esc(goed.naam)}</b>!</span></div>` : ""}
    <div class="row">${keus ? (laatste ? verder() : `<button class="btn" id="obVolgendeVraag">Volgende vraag</button>`) : ""}${state.obQ>0?`<button class="ghost" id="obVorigeVraag">Vorige vraag</button>`:""}</div>
    ${juf(esc(q.juf))}</div>`;
};

SCHERM["ob-raad"] = () => {
  const lijst=obRaad(), klaar=state.obI>=lijst.length;
  const pan = `<div class="obpan">${img(pad.soep("pan"),"De pan")}<div class="obinpan">${state.obPan.map(k=>img(pad.ing(k))).join("")}</div></div>`;
  if (klaar) return band("Deze groenten zaten in de soep!") + `<div class="inner obles"><div class="obraad">
      <div class="obklaar">${state.obPan.map(k=>`<figure>${img(pad.ing(k))}<figcaption>${esc(INGREDIENTEN[k])}</figcaption></figure>`).join("")}</div>${pan}</div>
      <div class="row">${verder()}<button class="ghost" id="obRaadOpnieuw">Nog een keer</button></div>
      ${juf("Welke groente vond jij het lekkerst in de soep? Welke heb je weleens in het echt vastgehouden?")}</div>`;
  const k=lijst[state.obI], inSoep=LES.speur.goed.includes(k), naam=INGREDIENTEN[k];
  const fb = state.obAntw==="goed" ? (inSoep ? `Ja! ${esc(naam)} zat in de soep.` : `Klopt! ${esc(naam)} zat er niet in.`)
           : state.obAntw==="fout" ? "Hmm, kijk nog eens goed. Probeer het nog een keer!" : "";
  return band(state.obOnthuld ? "Zat ik in de soep?" : "Wie ben ik?") + `<div class="inner obles"><div class="obraad">
    <div class="obspel">
      <button class="obschaduw ${state.obOnthuld?"onthuld":""} ${state.obAntw==="fout"?"shake":""}" id="obOnthul" ${state.obOnthuld?"disabled":""} aria-label="${state.obOnthuld?esc(naam):"Wie ben ik? Tik om te zien"}">${img(pad.ing(k))}${state.obOnthuld?`<b>${esc(naam)}</b>`:`<b>?</b>`}</button>
      <div class="obzij">
        <span class="obdots">${lijst.map((_,i)=>`<i class="${i<=state.obI?"on":""}"></i>`).join("")}</span>
        ${!state.obOnthuld ? `<button class="btn obgroot" id="obOnthul2">Wie ben ik?</button>`
          : state.obAntw==="goed" ? `<div class="obfb ok">${fb}</div><button class="btn obgroot" id="obVolgende">${state.obI===lijst.length-1?"Klaar!":"Volgende groente"}</button>`
          : `<div class="objanee"><button class="obknop" data-obja="ja"><span class="emo">👍</span><b>Ja</b></button><button class="obknop" data-obja="nee"><span class="emo">👎</span><b>Nee</b></button></div>${fb?`<div class="obfb no">${fb}</div>`:""}`}
      </div>
    </div>${pan}</div>
    ${juf(state.obOnthuld ? `Zat ${esc(naam.toLowerCase())} in de soep? Duim omhoog of duim omlaag?` : "Wie ben ik? Kijk goed naar mijn vorm. Weet je het? Fluister het tegen je buurman!")}</div>`;
};

SCHERM["ob-kies"] = () => {
  const items=KIES(), n=items.length, gedaan=Object.keys(state.obGeplaatst).length, klaar=gedaan===n;
  const open=items.filter(it=>!state.obGeplaatst[it.k]);
  return band("Elke dag of af en toe?") + `<div class="inner obles">
    ${open.length?`<div class="obitems">${open.map(it=>`<button class="obitem ${state.obSel===it.k?"sel":""} ${state.obSchud===it.k?"shake":""}" data-obitem="${it.k}">${it.beeld}<b>${esc(it.naam)}</b></button>`).join("")}</div>`:""}
    <div class="obbakken">${BAKKEN.map(b=>`<button class="obbak" style="--bc:${b.kleur}" data-obbak="${b.id}"><h3><span>${b.emo}</span>${b.naam}</h3><div class="obbakin">${
      items.filter(it=>state.obGeplaatst[it.k]===b.id).map(it=>`<span class="obmini">${it.beeld}</span>`).join("")}</div></button>`).join("")}</div>
    ${state.obMelding ? `<div class="obfb ${state.obMelding.ok?"ok":"no"}">${esc(state.obMelding.t)}</div>` : ""}
    <div class="row">${klaar ? verder() : `<button class="ghost" id="obKiesAlles">Toon het antwoord</button>`}</div>
    ${juf(klaar ? "Wat eet of drink jij elke dag? En wanneer eet je iets voor af en toe? Op een feestje!" : "Sleep het plaatje naar de goede mand. Is het iets voor elke dag, of iets voor af en toe, zoals op een feestje?")}</div>`;
};

SCHERM["ob-doen"] = () => {
  const kaarten=[
    ["✋","Voelzak","Stop een paar echte groenten uit de soep in een zak. De kinderen voelen zonder te kijken en raden welke groente het is."],
    ["🎨","Stempelen met groente","Snijd groente doormidden: een halve paprika, een plakje wortel, een roosje broccoli. Stempel met verf op papier. Welke vormen zie je?"],
    ["🛒","Groentewinkel","Maak in de huishoek een groentewinkel. Wie koopt de groenten voor de soep van morgen?"],
    ["⭐","Durfkaart","Elk kind krijgt een stempel als het iets nieuws durfde te proeven. Niet omdat het lekker was, maar omdat je het probeerde!"]];
  return band("Aan de slag!") + `<div class="inner obles"><div class="obdoen">${kaarten.map(([e,t,u])=>`<div class="obkaart"><span class="emo">${e}</span><h3>${t}</h3><p>${u}</p></div>`).join("")}</div>
    ${juf("Kies een of twee opdrachten voor in de hoeken of voor later deze week.")}</div>`;
};

/* ============ RENDER ============ */
function render(){
  document.querySelectorAll("[data-niveau]").forEach(b=>b.setAttribute("aria-pressed", b.dataset.niveau===state.niveau));
  const groep = {g12:"groep 1-2",g56:"groep 5-6",g78:"groep 7-8"}[state.niveau], st = $("#stage");
  $("#sub").textContent = (LES ? LES.naam : "Kies een soep") + " · " + groep;
  $("#brandImg").src = pad.ing(LES ? LES.mascotte : "wortel");
  document.title = LES ? "Soepdetective · " + LES.naam : "Soepdetective";
  if (!LES){ $("#stepsWrap").hidden=true; st.innerHTML=SCHERM.kiezer(); $("#prev").disabled=true; $("#next").disabled=true; $("#next").textContent="Start"; return; }
  $("#next").disabled = false;
  $("#prev").disabled = false;
  if (state.scherm<0){ $("#stepsWrap").hidden=true; st.innerHTML=SCHERM.start(); $("#next").textContent="Start"; return; }
  $("#stepsWrap").hidden=false;
  $("#steps").innerHTML = stappen().map((o,i)=>`<button class="step ${i===state.scherm?"on":i<state.scherm?"done":""}" data-go="${i}"><i>${i<state.scherm?"✓":i+1}</i>${esc(o.naam)}</button>`).join("");
  const on=$("#steps .on"); if(on) on.scrollIntoView({block:"nearest",inline:"nearest"});
  st.innerHTML = SCHERM[stappen()[state.scherm].id]();
  $("#next").textContent = state.scherm===stappen().length-1 ? "Klaar" : "Volgende";
  after(stappen()[state.scherm].id);
}
function obPlaats(k,bak){
  const it=KIES().find(x=>x.k===k);
  if (it.bak===bak){ state.obGeplaatst[k]=bak; const Naam=it.naam[0].toUpperCase()+it.naam.slice(1); state.obMelding={ok:true,t:bak==="dag"?`Ja! ${Naam} is goed voor elke dag.`:`Ja! ${Naam} is voor af en toe.`};
    if(Object.keys(state.obGeplaatst).length===KIES().length) confetti(); }
  else { state.obSchud=k; state.obMelding={ok:false,t:"Hmm, denk nog eens na. Probeer de andere mand!"}; }
  state.obSel=null; render(); state.obSchud=null;
}
function after(id){
  if (id==="ob-kies") document.querySelectorAll(".obitem[data-obitem]").forEach(el=>{ const k=el.dataset.obitem;
    drag(el, ()=>[...document.querySelectorAll(".obbak")], t=>{ if(!t){ state.obSel = state.obSel===k?null:k; state.obMelding=null; render(); } else obPlaats(k,t.dataset.obbak); }, el.innerHTML, true); });
  if (id==="speur") document.querySelectorAll(".ing[data-ing]:not(:disabled)").forEach(el=>
    drag(el, ()=>[$("#pan")], ()=>probeer(el.dataset.ing), img(pad.ing(el.dataset.ing))));
  if (id==="lichaam"){ const a=L(LES.lichaam.act); if (a.type==="sorteer") document.querySelectorAll(".item[data-item]").forEach(el=>{
    const i=+el.dataset.item;
    drag(el, ()=>[...document.querySelectorAll(".bin")], t=>{ if(!t){ state.sortSel = state.sortSel===i?null:i; state.sortMelding=null; render(); } else plaats(i,t.dataset.bak); },
      `<span class="gtext">${esc(a.items[i].naam.slice(0,34))}${a.items[i].naam.length>34?"…":""}</span>`, true); }); }
  if (id==="koppel") document.querySelectorAll(".card[data-ras]:not(:disabled)").forEach(el=>{
    const k=el.dataset.ras;
    drag(el, ()=>[...document.querySelectorAll(".name:not(:disabled)")], t=>{ if(!t){ state.sel = state.sel===k?null:k; state.rasMelding=null; render(); } else koppel(k,t.dataset.naam); }, img(pad.soep("koppel-"+k)), true);
  });
}
function drag(el, targets, onDrop, ghostHTML, tapGivesNull){
  el.addEventListener("pointerdown", e=>{
    if (e.button>0) return; e.preventDefault();
    const sx=e.clientX, sy=e.clientY; let ghost=null, moved=false;
    const hit = ev => targets().find(t=>{ const r=t.getBoundingClientRect(); return ev.clientX>r.left&&ev.clientX<r.right&&ev.clientY>r.top&&ev.clientY<r.bottom; }) || null;
    const move = ev=>{
      if(!moved && Math.hypot(ev.clientX-sx,ev.clientY-sy)<8) return;
      if(!moved){ moved=true; el.classList.add("lifted"); ghost=document.createElement("div"); ghost.className="ghost-drag"; ghost.innerHTML=ghostHTML; document.body.appendChild(ghost); }
      ghost.style.left=ev.clientX+"px"; ghost.style.top=ev.clientY+"px";
      const h=hit(ev); targets().forEach(t=>t.classList.toggle("hover",t===h));
    };
    const up = ev=>{
      removeEventListener("pointermove",move); removeEventListener("pointerup",up); removeEventListener("pointercancel",up);
      if(ghost) ghost.remove(); el.classList.remove("lifted"); targets().forEach(t=>t.classList.remove("hover"));
      if(!moved){ onDrop(tapGivesNull?null:true); return; }
      const h=hit(ev); if(h) onDrop(h);
    };
    addEventListener("pointermove",move); addEventListener("pointerup",up); addEventListener("pointercancel",up);
  });
  el.addEventListener("keydown", e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); onDrop(tapGivesNull?null:true); } });
}
function probeer(k){
  const d=LES.speur;
  if (d.goed.includes(k)){
    state.inPan.add(k); state.plons=true;
    const rest = d.goed.filter(x=>!state.inPan.has(x)).length;
    state.melding={ok:true,t:`Ja! ${INGREDIENTEN[k]} zit erin.`+(rest?` Nog ${rest} te gaan.`:"")};
    if(!rest) confetti();
  } else { state.fout.add(k); state.schud=k; state.melding={ok:false,t:`Nee, ${INGREDIENTEN[k].toLowerCase()} zit er niet in.`}; }
  render(); state.plons=false;
}
function plaats(i,bak){
  const a=L(LES.lichaam.act), it=a.items[i];
  if (it.bak===bak){ state.geplaatst[i]=bak; state.sortMelding={ok:true,t:`Ja! Dat is een ${bak}.`}; if(Object.keys(state.geplaatst).length===a.items.length) confetti(); }
  else { state.sortSchud=i; state.sortMelding={ok:false,t:"Hmm, kijk nog eens goed. Probeer het andere vak!"}; }
  state.sortSel=null; render();
}
function koppel(k,naam){
  const r=LES.koppel, x=r.lijst.find(y=>y.key===k);
  if (k===naam){ state.paren.add(k); state.rasMelding={ok:true,t:r.goedZo.replace("{naam}",x.naam)}; if(state.paren.size===koppelLijst().length) confetti(); }
  else { state.misser=naam; state.rasMelding={ok:false,t:r.mis}; }
  state.sel=null; render();
}
function go(i){ if(!LES) return; if(i<-1){ naarKiezer(); return; } state.scherm=Math.min(stappen().length-1,i); render(); window.scrollTo({top:0}); }

/* ============ SOEP KIEZEN ============
   De soep staat in de url (#wortel), zodat je een les direct kunt delen of als bladwijzer opslaan. */
function laadSoep(id){
  return new Promise((ok,nee)=>{
    if (LESSEN[id]) return ok();
    const s=document.createElement("script"); s.src=`soepen/${id}/les.js`;
    s.onload=()=>LESSEN[id]?ok():nee(); s.onerror=nee; document.head.appendChild(s);
  });
}
async function openSoep(id){
  const soep = SOEPEN.find(s=>s.id===id && s.klaar);
  if (!soep){ naarKiezer(); return; }
  try { await laadSoep(id); } catch { LES=null; state.soep=null; Object.assign(state,vers()); state.laadFout=`Oeps, de ${soep.naam.toLowerCase()} kon niet geladen worden.`; render(); return; }
  state.soep=id; state.laadFout=null; LES=LESSEN[id]; Object.assign(state,vers()); state.scherm=-1; render(); window.scrollTo({top:0});
}
function naarKiezer(){ LES=null; state.soep=null; Object.assign(state,vers()); state.scherm=-1; if(location.hash) history.pushState(null,"",location.pathname+location.search); render(); }
const vanUrl = () => { const id=decodeURIComponent(location.hash.slice(1)); id ? openSoep(id) : naarKiezer(); };
addEventListener("hashchange", vanUrl);

$("#next").addEventListener("click",()=>{ if(!LES) return; if(state.scherm===stappen().length-1){ Object.assign(state,vers()); go(-1); return; } go(state.scherm+1); });
$("#prev").addEventListener("click",()=>go(state.scherm-1));
$("#home").addEventListener("click",naarKiezer);

document.addEventListener("click",e=>{
  const t=e.target.closest("button"); if(!t||t.disabled) return; const d=t.dataset;
  if(d.soep){ if(location.hash==="#"+d.soep) openSoep(d.soep); else location.hash=d.soep; return; }
  if(d.kies!==undefined){ naarKiezer(); return; }
  if(d.go!==undefined){ go(+d.go); return; }
  if(d.niveau){ if(state.niveau!==d.niveau){ const wissel=(state.niveau==="g12")!==(d.niveau==="g12"); state.niveau=d.niveau; Object.assign(state,vers()); if(wissel && state.scherm>=0) state.scherm=-1; render(); } return; }
  if(d.word){ state.woorden.has(d.word)?state.woorden.delete(d.word):state.woorden.add(d.word); render(); return; }
  if(d.vote!==undefined){ state.stemmen[+d.vote]++; render(); return; }
  if(t.id==="voteReset"){ state.stemmen=[0,0,0,0,0]; render(); return; }
  if(t.id==="panReset"){ Object.assign(state,{inPan:new Set(),fout:new Set(),volgorde:null,melding:null}); render(); return; }
  if(t.id==="panAll"){ LES.speur.goed.forEach(k=>state.inPan.add(k)); state.melding=null; render(); return; }
  if(d.wat!==undefined){ state.wat[+d.wat]++; render(); return; }
  if(t.id==="kernOpen"){ state.kernOpen=true; confetti(); render(); return; }
  if(d.kaart){ state.kaartOpen.add(d.kaart); if(kernKlaar(L(LES.lichaam.act))) confetti(); render(); return; }
  if(t.id==="kaartAll"){ L(LES.lichaam.act).opties.forEach(o=>{ if(o.goed) state.kaartOpen.add(o.key); }); render(); return; }
  if(d.bak){ if(state.sortSel!==null) plaats(state.sortSel,d.bak); else { state.sortMelding={ok:false,t:"Kies eerst een kaartje."}; render(); } return; }
  if(t.id==="sortAll"){ L(LES.lichaam.act).items.forEach((it,i)=>state.geplaatst[i]=it.bak); state.sortMelding=null; render(); return; }
  if(d.naam){ if(state.sel) koppel(state.sel,d.naam); else { state.rasMelding={ok:false,t:"Kies eerst een plaatje."}; render(); } return; }
  if(t.id==="rasAll"){ koppelLijst().forEach(x=>state.paren.add(x.key)); state.sel=null; render(); return; }
  if(d.ans!==undefined && state.gekozen===null){ state.gekozen=+d.ans; if(state.gekozen===L(LES.quiz)[state.q].goed) confetti(); render(); return; }
  if(t.id==="nextQ"){ state.q++; state.gekozen=null; render(); return; }
  if(t.id==="prevQ"){ state.q--; state.gekozen=null; render(); return; }
  if(t.id==="kijkNext"){ state.kijk++; render(); return; }
  if(d.expl!==undefined){ state.uitleg=new Set([+d.expl]); render(); return; }   // één uitleg tegelijk: past op het bord
  if(t.id==="zoom"){ state.groot=true; render(); return; }
  if(t.id==="closeZoom"){ state.groot=false; render(); return; }
  // onderbouw
  if(d.obstem!==undefined){ state.obStem[+d.obstem]++; render(); return; }
  if(t.id==="obStemReset"){ state.obStem=[0,0,0]; render(); return; }
  if(d.obkeus){ state.obKeus[state.obQ]=d.obkeus; render(); return; }
  if(t.id==="obVolgendeVraag"){ state.obQ++; render(); return; }
  if(t.id==="obVorigeVraag"){ state.obQ--; render(); return; }
  if(t.id==="obOnthul"||t.id==="obOnthul2"){ state.obOnthuld=true; state.obAntw=null; render(); return; }
  if(d.obja){ const k=obRaad()[state.obI], inSoep=LES.speur.goed.includes(k);
    if((d.obja==="ja")===inSoep){ state.obAntw="goed"; if(inSoep && !state.obPan.includes(k)) state.obPan.push(k); }
    else state.obAntw="fout";
    render(); if(state.obAntw==="fout") state.obAntw=null; return; }
  if(t.id==="obVolgende"){ state.obI++; state.obOnthuld=false; state.obAntw=null; if(state.obI>=obRaad().length) confetti(); render(); return; }
  if(t.id==="obRaadOpnieuw"){ Object.assign(state,{obI:0,obOnthuld:false,obAntw:null,obPan:[]}); render(); return; }
  if(d.obbak){ if(state.obSel) obPlaats(state.obSel,d.obbak); else { state.obMelding={ok:false,t:"Kies eerst een plaatje."}; render(); } return; }
  if(t.id==="obKiesAlles"){ KIES().forEach(it=>state.obGeplaatst[it.k]=it.bak); state.obMelding=null; state.obSel=null; render(); return; }
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&state.groot){ state.groot=false; render(); return; }
  if(!LES) return;
  if(e.key==="ArrowRight") $("#next").click();
  if(e.key==="ArrowLeft"&&state.scherm>=0) go(state.scherm-1);
});
/* ============ SCHALEN ============ */
const DIA_B = 1600, DIA_H = 900;   // ontwerpmaat van de dia (16:9)
function schaal(){
  const w=innerWidth, h=innerHeight, app=$(".app"), root=document.documentElement;
  const dia = w>=821 && w/h>=1.2;
  root.classList.toggle("dia", dia);
  if (!dia){ root.style.removeProperty("--vw"); app.style.height=app.style.transform=""; return; }
  const H = Math.max(DIA_H, Math.round(DIA_B*h/w)), k = Math.min(w/DIA_B, h/H);
  root.style.setProperty("--vw", DIA_B/100+"px");
  app.style.height = H+"px";
  app.style.transform = `translate(-50%,-50%) scale(${k})`;
}
addEventListener("resize", schaal);
schaal();
vanUrl();
</script>
